# Mecanismo: bancada do ponteiro (NEO 15:1, Through Bore na roboRIO). Modelo para os outros.
# Formato: CHAVE=valor (lido pelo bash com "source" e pelo Python em mec.py). Sem espaços em volta
# do "="; listas entre aspas. Para outro mecanismo: copie este arquivo, mude os valores e use
# MEC=<nome do arquivo sem .conf> antes do script (ex.: MEC=braco ./robusto.sh saida.csv).

# Nome do mecanismo no código (MechanismConfig.builder("Dial")): pasta /Tuning/<NOME>/ dos
# ajustes ao vivo e /Mech5ms/<NOME>/ do log a 5 ms.
NOME=Dial

# Onde o Epilogue publica a telemetria do MechanismSubsystem (campo do RobotContainer).
TELEM=Robot/m_robotContainer/mechanism

# Unidade e geometria. CIRCULAR=1: ângulo que dá a volta (erro pelo caminho mais curto, 0-360).
UNIDADE=graus
CIRCULAR=1
# Modelo da gravidade (igual ao MechanismConfig.gravity): COSINE (braço: kG·cos θ), CONSTANT
# (elevador: kG sempre) ou NONE (torre, shooter, rolo).
GRAVIDADE=COSINE

# Teste robusto (robusto.sh): alvos em sequência, misturando passos PEQUENOS e GRANDES (lição 2).
# Fique DENTRO do curso seguro do mecanismo (longe dos batentes).
INICIO=0
ALVOS="0 90 180 0 15 30 45 60 75 90 270 90 180 165 150 135 180 0 90 0"
# Mapa (mapa.sh): passos curtos por todo o curso e de volta.
MAPA="0 15 30 45 60 75 90 105 120 135 150 165 180 165 150 135 120 105 90 75 60 45 30 15 0"
# Tempo em cada alvo (s), além dos ~3 s que cada comando leva pelo Wi-Fi.
ESPERA=2.6
# Passo a partir do qual o movimento conta como GRANDE nas análises.
GRANDE=60
# Tolerância de "chegou" (unidade do mecanismo) para o tempo de chegada.
TOL=1.0

# Assistente de ajuste (autoajuste.sh / ganhos.py): critérios do LQR para o kP/kD de PARTIDA.
# Erro de posição e de velocidade "aceitáveis" e a tensão que se aceita gastar para corrigi-los.
# Mais apertado = ganhos maiores. ATRASO_MS = atraso do acionamento (CAN + controlador).
LQR_TOL_POS=2
LQR_TOL_VEL=50
LQR_UMAX=6
ATRASO_MS=10
# Feedforward pelo kit (RemoteCmd 11, só FF): onde começar as passadas lentas (±40° em volta).
# Para braço (COSINE), perto da horizontal (cos grande separa kG de kS).
FF_INICIO=0

# Teste de parada no ponto fraco (testeparada.sh): onde a gravidade não segura o mecanismo contra
# a folga (aqui: pendurado, 270°) e de onde partir para chegar nele.
PARADA_ALVO=270
PARADA_DE="90 180"

# Nota de cada configuração (pontua.py; menor = melhor). Pesos de cada critério — o que importa mais
# NESTE mecanismo. Faltando uma chave, vale o padrão (o mesmo daqui). passa = passada média do
# alvo; grandes = passada nos movimentos grandes; max = pior passada; erro = erro final; chega =
# tempo de chegada (s); tremor = tremor parado; problema = por rodada que oscilou/não chegou;
# parada = por parada no PARADA_ALVO que oscilou. Ex.: shooter (rapidez) chega=3; braço que
# precisa acertar a altura erro=4.
NOTA_PESOS="passa=1 grandes=0.5 max=0.25 erro=2 chega=1 tremor=2 problema=10 parada=10"

# Assistente: paradas no PARADA_ALVO depois de cada rodada da bateria (0 = não faz). Pega
# configurações que oscilam paradas no ponto fraco (o robusto passa por ele poucas vezes).
PARADAS_POR_RODADA=5
# Segunda volta do assistente: se a melhor configuração for a de ganho MAIS ALTO (ou mais baixo)
# testada, testa mais dois degraus para aquele lado, multiplicando (ou dividindo) por isto.
VOLTA2_FATOR=1.3

# Segurança da bateria de testes: pausa com o motor parado acima disto (°C) até esfriar.
TEMP_MAX=55
TEMP_VOLTA=45
